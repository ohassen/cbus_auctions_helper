name: Daily Auction Monitor

on:
  schedule:
    # Run at 10 AM UTC daily (6 AM EST / 5 AM EDT)
    - cron: '0 10 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      skip_scraping:
        description: 'Skip web scraping (use existing data)'
        required: false
        type: boolean
        default: false
      skip_matching:
        description: 'Skip semantic matching'
        required: false
        type: boolean
        default: false
      log_level:
        description: 'Logging level'
        required: false
        type: choice
        options:
          - INFO
          - DEBUG
          - WARNING
        default: 'INFO'

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Required to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch with token that has write permissions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          sudo env "PATH=$PATH" playwright install-deps chromium

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: auction_data.db
          key: auction-db-v3-${{ github.run_number }}
          restore-keys: |
            auction-db-v3-

      - name: Run auction monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
        run: |
          # Build command with optional flags
          CMD="python -m src.main --skip-email"

          if [ "${{ inputs.skip_scraping }}" = "true" ]; then
            CMD="$CMD --skip-scraping"
          fi

          if [ "${{ inputs.skip_matching }}" = "true" ]; then
            CMD="$CMD --skip-matching"
          fi

          CMD="$CMD --log-level ${{ inputs.log_level || 'INFO' }}"

          echo "Running: $CMD"
          $CMD

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: auction_data.db
          key: auction-db-v3-${{ github.run_number }}

      - name: Commit results
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add markdown report and database if they exist
          git add LATEST_RESULTS.md auction_data.db || true

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update auction results - $(date -u +%Y-%m-%d)"

            # Pull latest changes and rebase, then push
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: run-monitor
    if: failure()

    steps:
      - name: Send failure notification
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          # Simple failure notification using Python
          python3 << 'EOF'
          import smtplib
          import os
          from email.mime.text import MIMEText

          smtp_host = 'smtp.gmail.com'
          smtp_port = 587
          username = os.environ.get('EMAIL_USER', '')
          password = os.environ.get('EMAIL_PASSWORD', '')
          recipient = os.environ.get('EMAIL_RECIPIENT', '')

          if not all([username, password, recipient]):
              print("Email not configured, skipping notification")
              exit(0)

          msg = MIMEText(f"""
          The Auction Monitor workflow failed.

          Run: {os.environ.get('GITHUB_RUN_NUMBER', 'unknown')}
          Repository: {os.environ.get('GITHUB_REPOSITORY', 'unknown')}

          Please check the GitHub Actions logs for details:
          https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}
          """)

          msg['Subject'] = 'Auction Monitor - Workflow Failed'
          msg['From'] = username
          msg['To'] = recipient

          try:
              with smtplib.SMTP(smtp_host, smtp_port) as server:
                  server.starttls()
                  server.login(username, password)
                  server.send_message(msg)
              print("Failure notification sent")
          except Exception as e:
              print(f"Failed to send notification: {e}")
          EOF
